apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: svc-alpha
  title: Service Alpha
  description: Primary IDP demo service. Calls svc-beta. Demonstrates canary rollout from v1 to v2.
  annotations:
    backstage.io/techdocs-ref: dir:.
    argocd/app-name: svc-alpha
    backstage.io/kubernetes-id: svc-alpha
    prometheus.io/scrape: "true"
  tags:
    - nodejs
    - rest-api
    - canary
  links:
    - url: http://localhost/svc-alpha/v1/hello
      title: v1 Endpoint
      icon: api
    - url: http://localhost/svc-alpha/v2/hello
      title: v2 Endpoint
      icon: api
    - url: http://localhost/rollouts
      title: Argo Rollouts Dashboard
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: idp-demo
  dependsOn:
    - component:svc-beta
  providesApis:
    - svc-alpha-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: svc-alpha-api
  title: Service Alpha API
  description: REST API with v1 and v2 endpoints demonstrating API versioning lifecycle
spec:
  type: openapi
  lifecycle: production
  owner: platform-team
  system: idp-demo
  definition:
    $text: ./openapi.yaml
