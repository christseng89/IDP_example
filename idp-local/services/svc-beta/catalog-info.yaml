apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: svc-beta
  title: Service Beta
  description: Downstream IDP demo service. Standalone dependency consumed by svc-alpha.
  annotations:
    backstage.io/techdocs-ref: dir:.
    argocd/app-name: svc-beta
    backstage.io/kubernetes-id: svc-beta
    prometheus.io/scrape: "true"
  tags:
    - nodejs
    - rest-api
    - canary
  links:
    - url: http://localhost/svc-beta/v1/hello
      title: v1 Endpoint
      icon: api
    - url: http://localhost/svc-beta/v2/hello
      title: v2 Endpoint
      icon: api
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: idp-demo
  providesApis:
    - svc-beta-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: svc-beta-api
  title: Service Beta API
  description: REST API with v1 and v2 endpoints — downstream dependency of svc-alpha
spec:
  type: openapi
  lifecycle: production
  owner: platform-team
  system: idp-demo
  definition:
    $text: ./openapi.yaml
