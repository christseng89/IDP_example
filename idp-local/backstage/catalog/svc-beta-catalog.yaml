apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: svc-beta
  title: Service Beta
  description: Downstream IDP demo service. Standalone dependency consumed by svc-alpha.
  annotations:
    backstage.io/techdocs-ref: dir:.
    argocd/app-name: svc-beta
    backstage.io/kubernetes-id: svc-beta
    prometheus.io/scrape: "true"
  tags:
    - nodejs
    - rest-api
    - canary
  links:
    - url: http://localhost/svc-beta/v1/hello
      title: v1 Endpoint
      icon: api
    - url: http://localhost/svc-beta/v2/hello
      title: v2 Endpoint
      icon: api
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: idp-demo
  providesApis:
    - svc-beta-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: svc-beta-api
  title: Service Beta API
  description: REST API with v1 and v2 endpoints — downstream dependency of svc-alpha
spec:
  type: openapi
  lifecycle: production
  owner: platform-team
  system: idp-demo
  definition: |
    openapi: "3.0.3"
    info:
      title: Service Beta API
      version: "2.0.0"
      description: "IDP demo downstream service — v1 (deprecated) and v2 (production)."
    servers:
      - url: http://localhost/svc-beta
    paths:
      /v1/hello:
        get:
          summary: Hello (v1)
          operationId: helloV1
          deprecated: true
          responses:
            "200":
              description: Basic hello response
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      version: { type: string, example: v1 }
                      service: { type: string, example: svc-beta }
                      message: { type: string, example: "Hello from v1" }
      /v2/hello:
        get:
          summary: Hello (v2)
          operationId: helloV2
          responses:
            "200":
              description: Enriched hello response
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      version: { type: string, example: v2 }
                      service: { type: string, example: svc-beta }
                      message: { type: string, example: "Hello from v2" }
                      timestamp: { type: string, format: date-time }
                      requestId: { type: string, format: uuid }
                      capabilities:
                        type: array
                        items: { type: string }
