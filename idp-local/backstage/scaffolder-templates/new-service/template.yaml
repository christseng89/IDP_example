apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-idp-service
  title: New IDP Service
  description: >
    [DEMO] Captures the parameters that a real golden-path scaffolder would
    use to bootstrap a Node.js (Express) service: v1/v2 API versioning,
    Prometheus metrics, Argo Rollouts canary strategy, catalog entry,
    OpenAPI spec, and TechDocs.

    This local-demo variant uses debug:log actions only — no Git push,
    no real file generation — because the official Backstage image's
    pod has no Git credentials and no persistent volume. The form flow
    and success page are the same as a production scaffolder; only the
    backing actions differ.
  tags:
    - nodejs
    - rest-api
    - canary
    - golden-path
    - demo
spec:
  owner: platform-team
  type: service

  parameters:
    - title: Service details
      required:
        - serviceName
        - owner
        - description
      properties:
        serviceName:
          title: Service Name
          type: string
          description: Lowercase, kebab-case (e.g. svc-gamma)
          pattern: "^[a-z][a-z0-9-]+$"
        owner:
          title: Owner Team
          type: string
          default: platform-team
        description:
          title: Description
          type: string

    - title: Infrastructure
      properties:
        replicaCount:
          title: Initial replica count
          type: integer
          default: 2
        cpuRequest:
          title: CPU request (millicores)
          type: string
          default: "50m"
        memoryRequest:
          title: Memory request
          type: string
          default: "64Mi"

  steps:
    - id: capture
      name: Capture service parameters
      action: debug:log
      input:
        message: |
          [DEMO] New IDP Service request received:
            Service Name : ${{ parameters.serviceName }}
            Owner Team   : ${{ parameters.owner }}
            Description  : ${{ parameters.description }}
            Replicas     : ${{ parameters.replicaCount }}
            CPU request  : ${{ parameters.cpuRequest }}
            Memory       : ${{ parameters.memoryRequest }}

    - id: would-create-repo
      name: (would) Create Git repo from skeleton
      action: debug:log
      input:
        message: |
          In production this step would render the Node.js skeleton
          (Express + Pino + Prometheus client) with the captured values,
          then git init + add + commit + push to the configured Git host
          (e.g. github:repoUrl=github.com?owner=...&repo=${{ parameters.serviceName }}).

          Required Backstage config for production:
            - integrations.github (or gitlab/bitbucket) with a token
            - scaffolder.defaultAuthor + defaultCommitMessage in app-config

    - id: would-bootstrap-cd
      name: (would) Add Argo CD Application
      action: debug:log
      input:
        message: |
          In production this step would create an Argo CD Application
          pointing at the newly-pushed repo's chart path, mirroring the
          existing svc-alpha / svc-beta Application definitions.

    - id: would-register
      name: (would) Register in Backstage catalog
      action: debug:log
      input:
        message: |
          In production this step would register the new repo's
          catalog-info.yaml so the service appears in the Catalog
          alongside svc-alpha and svc-beta.

  output:
    text:
      - title: Demo summary
        content: |
          The form captured **${{ parameters.serviceName }}** ready for the
          golden-path. In a production environment, the three "(would)"
          steps above would be replaced with real `publish:github`,
          `argocd:create-resources`, and `catalog:register` actions.

          Existing in-cluster services demonstrating the full flow:
          - **svc-alpha** — full canary rollout with AnalysisTemplate
          - **svc-beta** — downstream dependency
    links:
      - title: Argo CD (existing apps)
        url: /argocd
        icon: catalog
      - title: Backstage Catalog
        url: /catalog
        icon: catalog
