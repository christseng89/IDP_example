app:
  title: IDP Demo Portal
  baseUrl: ${base_url}

organization:
  name: Platform Engineering

backend:
  baseUrl: ${base_url}
  listen:
    port: 7007
  database:
    client: better-sqlite3
    connection: ':memory:'
  cors:
    # CORS origin must NOT include a path — only scheme://host:port.
    origin: ${cors_origin}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]

integrations: {}

techdocs:
  builder: local
  generator:
    runIn: local
  publisher:
    type: local

auth:
  providers:
    # Guest auth is the simplest provider — no IdP, no secrets. Backstage's
    # auth-backend plugin only registers the /api/auth/guest/refresh route
    # if this block exists; an empty providers map means the frontend's
    # Guest sign-in card calls a 404 endpoint and rendering falls through
    # to NotFoundPage ("Looks like someone dropped the mic!").
    #
    # The Dockerfile sets NODE_ENV=production, and guest auth is disabled
    # outside development by default (Backstage assumes you'd use a real
    # IdP in prod). Override that with dangerouslyAllowOutsideDevelopment
    # for this local demo deployment.
    guest:
      dangerouslyAllowOutsideDevelopment: true

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Group, User, Resource, Location, Template]
  locations:
    - type: file
      target: /backstage/catalog/all.yaml
      rules:
        - allow: [System, Group, Location]

argocd:
  username: admin
  password: $${ARGOCD_ADMIN_PASSWORD}
  waitCycles: 25
  appLocatorMethods:
    - type: config
      instances:
        - name: local
          url: http://argocd-server.argocd.svc.cluster.local

kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: docker-desktop
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          skipTLSVerify: true # demo-only: Docker Desktop uses a self-signed cert
          serviceAccountToken:
            $secret:
              name: backstage-k8s-token
              key: token
