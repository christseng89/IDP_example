apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-stable
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "20"
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /svc-alpha(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-stable
                port:
                  number: {{ .Values.service.port }}
---
# Canary ingress — NGINX canary annotations; weight managed by Argo Rollouts controller
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-canary
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "0"   # updated dynamically by Argo Rollouts
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /svc-alpha(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-canary
                port:
                  number: {{ .Values.service.port }}
