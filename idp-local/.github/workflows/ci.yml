name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Node.js services ─────────────────────────────────────────────────────────
  svc-alpha:
    name: svc-alpha lint + test + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/svc-alpha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run lint
      - run: npm test
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

  svc-beta:
    name: svc-beta lint + test + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/svc-beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run lint
      - run: npm test
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

  # ── Docker image builds + Trivy container scanning ───────────────────────────
  build-and-scan:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest
    needs: [svc-alpha, svc-beta]
    steps:
      - uses: actions/checkout@v4

      - name: Build svc-alpha:v1
        run: docker build --build-arg VERSION=v1 -t svc-alpha:v1 services/svc-alpha
      - name: Scan svc-alpha:v1
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: svc-alpha:v1
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Build svc-alpha:v2
        run: docker build --build-arg VERSION=v2 -t svc-alpha:v2 services/svc-alpha
      - name: Scan svc-alpha:v2
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: svc-alpha:v2
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Build svc-beta:v1
        run: docker build --build-arg VERSION=v1 -t svc-beta:v1 services/svc-beta
      - name: Scan svc-beta:v1
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: svc-beta:v1
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Build svc-beta:v2
        run: docker build --build-arg VERSION=v2 -t svc-beta:v2 services/svc-beta
      - name: Scan svc-beta:v2
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: svc-beta:v2
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  # ── Helm charts ───────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: '3.14.3'
      - run: helm lint charts/svc-alpha
      - run: helm lint charts/svc-beta

  # ── Terraform ─────────────────────────────────────────────────────────────────
  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.4'
      - name: terraform init
        working-directory: terraform
        run: terraform init -input=false
      - name: terraform validate
        working-directory: terraform
        run: terraform validate

  # ── YAML / manifest linting ───────────────────────────────────────────────────
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: >
            backstage/app-config.yaml
            backstage/catalog/
            charts/svc-alpha/values.yaml
            charts/svc-beta/values.yaml
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
                level: warning
              truthy:
                allowed-values: ['true', 'false', 'yes', 'no']

  # ── Production deployment gate (SOC2 CC8.2) ──────────────────────────────────
  # Runs only on push to main. Requires manual approval from a designated
  # reviewer configured in the "production" GitHub Environment. All quality
  # checks above must pass before the approval request is raised.
  deploy-gate:
    name: Production deployment gate
    runs-on: ubuntu-latest
    needs:
      - svc-alpha
      - svc-beta
      - build-and-scan
      - helm-lint
      - terraform-validate
      - yaml-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
    steps:
      - name: All gates passed
        run: |
          echo "Reviewer approved production deployment."
          echo "Commit: ${{ github.sha }}"
          echo "Actor:  ${{ github.actor }}"
          echo "Ref:    ${{ github.ref }}"
