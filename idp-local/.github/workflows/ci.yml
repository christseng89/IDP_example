name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Node.js services ─────────────────────────────────────────────────────────
  svc-alpha:
    name: svc-alpha lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/svc-alpha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run lint
      - run: npm test

  svc-beta:
    name: svc-beta lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/svc-beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run lint
      - run: npm test

  # ── Docker image builds ───────────────────────────────────────────────────────
  docker-build:
    name: Docker build (smoke test)
    runs-on: ubuntu-latest
    needs: [svc-alpha, svc-beta]
    steps:
      - uses: actions/checkout@v4
      - name: Build svc-alpha:v1
        run: docker build --build-arg VERSION=v1 -t svc-alpha:v1 services/svc-alpha
      - name: Build svc-alpha:v2
        run: docker build --build-arg VERSION=v2 -t svc-alpha:v2 services/svc-alpha
      - name: Build svc-beta:v1
        run: docker build --build-arg VERSION=v1 -t svc-beta:v1 services/svc-beta
      - name: Build svc-beta:v2
        run: docker build --build-arg VERSION=v2 -t svc-beta:v2 services/svc-beta

  # ── Helm charts ───────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: '3.14.3'
      - run: helm lint charts/svc-alpha
      - run: helm lint charts/svc-beta

  # ── Terraform ─────────────────────────────────────────────────────────────────
  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.4'
      - name: terraform init
        working-directory: terraform
        run: terraform init -input=false
      - name: terraform validate
        working-directory: terraform
        run: terraform validate

  # ── YAML / manifest linting ───────────────────────────────────────────────────
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: >
            backstage/app-config.yaml
            backstage/catalog/
            charts/svc-alpha/values.yaml
            charts/svc-beta/values.yaml
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
                level: warning
              truthy:
                allowed-values: ['true', 'false', 'yes', 'no']
